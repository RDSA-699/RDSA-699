  </path>
</g>

<circle cx="180" cy="250" r="7" fill="#FBBF24" opacity="0.25" filter="url(#blur)"><animate attributeName="cx" values="180;420;180" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="250;220;250" dur="8s" repeatCount="indefinite"/></circle>

