<svg width="1200" height="350" viewBox="0 0 1200 350" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B0A12"/><stop offset="0.5" stop-color="#14121F"/><stop offset="1" stop-color="#0A0F18"/>
  </linearGradient>
  <linearGradient id="accent" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FBBF24" stop-opacity="0"/><stop offset="0.3" stop-color="#FBBF24"/><stop offset="0.7" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 145) rotate(145) scale(390 320)">
    <stop stop-color="#FBBF24" stop-opacity="0.16"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" stroke="#94A3B8" stroke-opacity="0.06"/></pattern>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="11"/></filter>
  <style>
    .tag{font:700 13px Arial,Helvetica,sans-serif;letter-spacing:3px;fill:#FBBF24}.title{font:700 45px Arial,Helvetica,sans-serif;fill:#F8FAFC}.sub{font:400 19px Arial,Helvetica,sans-serif;fill:#CBD5E1}.micro{font:400 11px 'Courier New',monospace;fill:#64748B}.pill{font:700 11px Arial,Helvetica,sans-serif;fill:#FDE68A}.status{font:700 11px 'Courier New',monospace;fill:#FBBF24}.log{font:400 11px 'Courier New',monospace;fill:#CBD5E1}.ok{font:700 11px 'Courier New',monospace;fill:#FBBF24}.run{font:700 11px 'Courier New',monospace;fill:#A78BFA}.no{font:700 11px 'Courier New',monospace;fill:#64748B}
  </style>
</defs>
<rect x="1" y="1" width="1198" height="348" rx="20" fill="url(#bg)" stroke="#334155"/>
<rect x="1" y="1" width="1198" height="348" rx="20" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="348" rx="20" fill="url(#glow)"/>

<g opacity="0.7">
